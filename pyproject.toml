[project]
name = "pyplus"
version = "1.0.1"
description = "Personal Dutch grocery-shopping web app for PLUS.nl"
authors = [{ name = "Matthijs Berends" }]
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "icalendar>=5.0",
    "playwright>=1.44",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyplus", "plus"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/manual/ are live-API smoke scripts (need real credentials), not unit tests.
addopts = "--ignore=tests/manual"
